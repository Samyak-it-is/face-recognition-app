{% extends "layout.html" %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <div class="card">
            <div class="card-header">
                <h3>Add New User</h3>
            </div>
            <div class="card-body">
                <form id="add-user-form" method="POST" action="{{ url_for('add_user') }}">
                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="access_level" class="form-label">Access Level</label>
                        <select class="form-control" id="access_level" name="access_level" required>
                            <option value="basic">Basic</option>
                            <option value="staff">Staff</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Face Image</label>
                        <div class="video-container">
                            <img id="video" src="{{ url_for('video_feed') }}" alt="Video Feed">
                        </div>
                        <div class="text-center mt-2">
                            <button type="button" id="capture-btn" class="btn btn-info">Capture Image</button>
                        </div>
                        <div class="mt-3" id="captured-image-container" style="display: none;">
                            <p>Captured Image:</p>
                            <img id="captured-image" class="img-fluid" style="max-height: 200px;">
                        </div>
                        <input type="hidden" name="image_data" id="image-data">
                    </div>
                    
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary">Save User</button>
                        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
                
                <canvas id="canvas" width="640" height="480" style="display: none;"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('capture-btn').addEventListener('click', function() {
        // Create a temporary image element to capture the video frame
        const img = new Image();
        img.src = document.getElementById('video').src;
        
        img.onload = function() {
            const canvas = document.getElementById('canvas');
            const context = canvas.getContext('2d');
            
            // Draw the video frame to the canvas
            context.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            // Get the image data as base64 string
            const imageData = canvas.toDataURL('image/jpeg');
            
            // Set the image data to the form
            document.getElementById('image-data').value = imageData;
            
            // Show the captured image
            document.getElementById('captured-image').src = imageData;
            document.getElementById('captured-image-container').style.display = 'block';
        };
    });
</script>
{% endblock %}
