{% extends "layout.html" %}

{% block content %}
<div class="row">
    <div class="col-md-12 text-center">
        <h1>Facial Recognition Access Control</h1>
        <p class="lead">Please look at the camera to verify your identity</p>
    </div>
</div>

<div class="row mt-4">
    <div class="col-md-8 offset-md-2">
        <div class="video-container">
            <!-- Video element to display the webcam feed -->
            <video id="video" width="640" height="480" autoplay></video>
        </div>
        
        <div class="text-center capture-btn">
            <button id="capture-btn" class="btn btn-primary">Verify Identity</button>
        </div>
        
        <canvas id="canvas" width="640" height="480" style="display: none;"></canvas>
        
        <form id="detect-form" action="{{ url_for('detect_face') }}" method="POST" style="display: none;">
            <input type="hidden" name="image_data" id="image-data">
        </form>
    </div>
</div>

<script>
    // Access the user's webcam
    navigator.mediaDevices.getUserMedia({ video: true })
        .then(function(stream) {
            // Set the video source to the webcam stream
            const video = document.getElementById('video');
            video.srcObject = stream;
        })
        .catch(function(error) {
            console.error("Error accessing the camera: ", error);
            alert("Camera access is required for this application.");
        });

    // Handle the click event of the capture button
    document.getElementById('capture-btn').addEventListener('click', function() {
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');

        // Draw the current frame from the video stream onto the canvas
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        // Get the image data as a base64 string
        const imageData = canvas.toDataURL('image/jpeg');
        
        // Set the image data in the hidden input field
        document.getElementById('image-data').value = imageData;
        
        // Submit the form to send the image to the server
        document.getElementById('detect-form').submit();
    });
</script>
{% endblock %}
